spring:
  application:
    name: smart-library-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USERNAME:postgres.pzommhbckoubtsihscsx}
    password: ${DB_PASSWORD:Whendoihave@}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Su dung schema co san tren Supabase PostgreSQL, khong tu dong sua doi DDL
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:cHRpdC1zbWFydC1saWJyYXJ5LXNlY3JldC1rZXktMjAyNi12ZXJ5LWxvbmctYW5kLXNlY3VyZS1rZXk=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  python-worker:
    base-url: ${PYTHON_WORKER_BASE_URL:http://localhost:8000}
    timeout-seconds: ${PYTHON_WORKER_TIMEOUT_SECONDS:30}
  storage:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads/digital-copies}
